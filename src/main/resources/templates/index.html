<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4 text-center">Gestão de Estoque</h1>

    <!-- Mensagem de Erro -->
    <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Mensagem de Sucesso -->
    <div th:if="${sucesso}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Formulario de Cadastro / Edição -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white"
             th:text="${produto.id != null} ? 'Editar Produto' : 'Cadastrar Novo Produto'">
            Cadastrar Novo Produto
        </div>
        <div class="card-body">
            <form th:action="${produto.id != null} ? @{/estoque/atualizar} : @{/estoque/cadastrar}"
                  th:object="${produto}"
                  method="post">

                <!-- Guarda o ID do produto para atualizar no banco em vez de criar um novo -->
                <input type="hidden" th:field="*{id}" />

                <div class="row g-2">
                    <div class="col-md-4">
                        <input type="text" th:field="*{nome}" class="form-control" placeholder="Nome do Produto" required />
                    </div>
                    <div class="col-md-3">
                        <input type="number" step="0.01" th:field="*{preco}" class="form-control" placeholder="Preço" required />
                    </div>
                    <div class="col-md-3">
                        <input type="number" th:field="*{quantidade}" class="form-control" placeholder="Estoque" required />
                    </div>
                    <div class="col-md-2">
                        <button type="submit"
                                class="btn w-100"
                                th:classappend="${produto.id != null} ? 'btn-warning' : 'btn-success'"
                                th:text="${produto.id != null} ? 'Atualizar' : 'Cadastrar'">
                            Cadastrar
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Barra de Pesquisa -->
    <div class="card mb-3 shadow-sm">
        <div class="card-body py-2">
            <form th:action="@{/estoque}" method="get" class="row g-2 align-items-center">
                <div class="col-auto flex-grow-1">
                    <input type="text" name="nome" th:value="${termoBusca}" class="form-control form-control-sm" placeholder="Buscar produto por nome...">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary btn-sm">Buscar</button>
                    <a th:href="@{/estoque}" class="btn btn-outline-secondary btn-sm" th:if="${termoBusca}">Limpar</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela de Produtos -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">Produtos em Estoque</div>
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Registrar Venda</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${produtos}">
                    <td th:text="${p.nome}">Nome do Produto</td>
                    <td th:text="${'R$ ' + #numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</td>
                    <td>
                        <span class="badge bg-success fs-6" th:text="${p.quantidade}">0</span>
                    </td>
                    <td>
                        <form th:action="@{/estoque/vender}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="nome" th:value="${p.nome}"/>
                            <input type="number" name="quantidade" value="1" min="1" class="form-control form-control-sm" style="width: 70px;">
                            <button type="submit" class="btn btn-warning btn-sm">Vender</button>
                        </form>
                    </td>
                    <td>
                        <div class="d-flex gap-2">
                            <!-- Botão Editar -->
                            <a th:href="@{/estoque/editar/{id}(id=${p.id})}" class="btn btn-sm btn-outline-warning">
                                Editar
                            </a>

                            <!-- Botão Remover -->
                            <form th:action="@{/estoque/deletar}" method="post" class="d-inline">
                                <input type="hidden" name="nome" th:value="${p.nome}"/>
                                <button type="submit" class="btn btn-outline-danger btn-sm">Remover</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>

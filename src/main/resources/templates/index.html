<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Painel de Controle de Estoque</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4 text-center">Gestão de Estoque</h1>

    <!-- Formulario de Cadastro -->
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">Cadastrar Novo Produto</div>
        <div class="card-body">
            <form th:action="@{/estoque/cadastrar}" th:object="${novoProduto}" method="post" class="row g-3">
                <div class="col-md-4">
                    <input type="text" th:field="*{nome}" class="form-control" placeholder="Nome do Produto" required>
                </div>
                <div class="col-md-3">
                    <input type="number" step="0.01" th:field="*{preco}" class="form-control" placeholder="Preço (R$)" required>
                </div>
                <div class="col-md-3">
                    <input type="number" th:field="*{quantidade}" class="form-control" placeholder="Qtd Inicial" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Cadastrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela de Produtos com Ações de Venda -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">Produtos em Estoque</div>
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Estoque</th>
                    <th>Registrar Venda</th>
                    <th>Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${produtos}">
                    <td th:text="${p.nome}" class="fw-bold"></td>
                    <td th:text="'R$ ' + ${#numbers.formatDecimal(p.preco, 1, 2)}"></td>
                    <td>
                            <span th:text="${p.quantidade}"
                                  th:class="${p.quantidade < 5} ? 'badge bg-danger' : 'badge bg-success'">
                            </span>
                    </td>
                    <td>
                        <form th:action="@{/estoque/vender}" method="post" class="d-flex gap-2">
                            <input type="hidden" name="nome" th:value="${p.nome}"/>
                            <input type="number" name="quantidade" value="1" min="1" class="form-control form-control-sm" style="width: 70px;">
                            <button type="submit" class="btn btn-warning btn-sm">Vender</button>
                        </form>
                    </td>
                    <td>
                        <form th:action="@{/estoque/deletar}" method="post" class="d-inline">
                            <input type="hidden" name="nome" th:value="${p.nome}"/>
                            <button type="submit" class="btn btn-outline-danger btn-sm">Remover</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
